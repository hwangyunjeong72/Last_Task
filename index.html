
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="정환균의 성장 이야기와 프로젝트 포트폴리오">
<title>정환균 | 나의 성장 기록</title>

<style>
:root {
  --main: #FFCC78;
  --gray: #B0B0B0;
  --pink: #FFE0E0;
  --text: #333333;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  color: var(--text);
  background: var(--pink);
  line-height: 1.7;
}

/* 상단 메뉴 */
header {
  background: white;
  border-bottom: 3px solid var(--main);
  padding: 18px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.logo {
  font-size: 21px;
  font-weight: bold;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
}

nav a {
  color: #555;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
}

nav a:hover {
  color: #b67815;
}

/* 첫 화면 */
.hero {
  min-height: 520px;
  padding: 110px 20px 90px;
  text-align: center;
  background: linear-gradient(145deg, var(--pink), white);
}

.tag {
  display: inline-block;
  background: var(--main);
  border-radius: 30px;
  padding: 8px 22px;
  font-size: 14px;
  font-weight: bold;
}

.hero h1 {
  font-size: clamp(40px, 6vw, 64px);
  margin: 25px 0 15px;
}

.hero h2 {
  font-size: clamp(21px, 3vw, 30px);
  margin: 0 auto 20px;
  max-width: 850px;
  line-height: 1.5;
}

.hero p {
  color: #666;
  font-size: 17px;
  margin-bottom: 35px;
}

/* 첫 화면 이동 버튼 */
.buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
}

.buttons a {
  display: inline-block;
  min-width: 130px;
  padding: 13px 18px;
  background: white;
  color: #333;
  border: 2px solid var(--gray);
  border-radius: 14px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.2s;
}

.buttons a:hover {
  background: var(--main);
  border-color: var(--main);
  transform: translateY(-3px);
}

/* 본문 전체 */
main {
  max-width: 1050px;
  padding: 55px 20px;
  margin: auto;
}

section {
  margin-bottom: 35px;
  background: white;
  padding: 35px;
  border-radius: 20px;
  border-left: 7px solid var(--main);
  box-shadow: 0 5px 18px #0000000b;
  scroll-margin-top: 25px;
}

section:nth-child(even) {
  border-left-color: var(--gray);
}

section h2 {
  font-size: 25px;
  margin: 0 0 15px;
}

/* 나중에 내용을 입력할 공간 */
.content {
  min-height: 130px;
  border-top: 1px solid #eeeeee;
  padding-top: 20px;
}

/* 연락처 */
.contact {
  background: var(--main);
  text-align: center;
  padding: 45px 20px;
}

.contact h2 {
  margin: 0 0 12px;
}

.contact a {
  color: #333;
  font-weight: bold;
  text-decoration: underline;
  overflow-wrap: anywhere;
}

/* 하단 */
footer {
  text-align: center;
  background: var(--gray);
  color: #222;
  padding: 20px;
  font-size: 13px;
}

/* 모바일 화면 */
@media (max-width: 600px) {
  header {
    flex-direction: column;
    text-align: center;
  }

  nav {
    justify-content: center;
    gap: 12px;
  }

  .hero {
    padding: 75px 18px;
    min-height: auto;
  }

  .hero p {
    font-size: 15px;
  }

  section {
    padding: 25px 20px;
  }

  .buttons a {
    min-width: 42%;
  }
}
</style>
</head>

<body>

<!-- 상단 메뉴 -->
<header>
  <div class="logo">정환균 | PORTFOLIO</div>

  <nav>
    <a href="#story">내 이야기</a>

</div>

  <a href="mailto:hwangyunjeong72@gmail.com">

<!-- 하단 -->
<footer>

</footer>

</body>
</html>
