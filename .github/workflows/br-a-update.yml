name: BR-A 자동 갱신 실행

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: br-a-update-main
  cancel-in-progress: false

jobs:
  update:
    name: CSV 집계 및 동일 결과 검사
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 설치 (GitHub 서버에서만)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 숫자 자동 갱신
        run: python updater/update.py

      - name: 동일 결과 및 출처 검증
        run: python updater/test.py

      - name: 갱신 결과 파일 저장 (검토용 다운로드)
        uses: actions/upload-artifact@v4
        with:
          name: br-a-summary
          path: updater/summary.json
          retention-days: 30

      - name: 능력별 근거 문단 후보 생성 (승인 전)
        run: python updater/generate_candidates.py

      - name: 후보 날짜·출처·재현성 검사
        run: python updater/test_candidates.py

      - name: 승인 전 후보 내려받기 (사이트 미게시)
        uses: actions/upload-artifact@v4
        with:
          name: br-a-candidates-review
          path: updater/output/candidates.json
          retention-days: 7

      - name: 사용자 승인/거절 결과 생성
        run: python updater/approve_candidates.py

      - name: 승인 게이트 및 재현성 검사
        run: python updater/test_approval.py

      - name: 공개 사이트 연결 및 승인 상태 검증
        run: python updater/test_site.py

      - name: 승인 결과 JSON 내려받기
        uses: actions/upload-artifact@v4
        with:
          name: br-a-approved-only
          path: updater/approved.json
          retention-days: 30

      - name: 승인된 문장 JSON과 숫자 JSON만 GitHub에 반영
        shell: bash
        run: |
          if git diff --quiet -- updater/summary.json && [ -z "$(git ls-files --others --exclude-standard updater/approved.json)" ] && git diff --quiet -- updater/approved.json; then
            echo "변경된 승인 결과 및 숫자가 없습니다. 커밋 생략."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- updater/summary.json updater/approved.json
          git commit -m "BR-A: update reviewed paragraphs and numeric summary"
          git push
